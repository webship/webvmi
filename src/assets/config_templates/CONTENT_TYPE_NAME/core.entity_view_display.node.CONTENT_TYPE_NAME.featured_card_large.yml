# Featured card - large: the fields laid out with Display Builder, without components.
langcode: en
status: true
dependencies:
  config:
    - core.entity_view_mode.node.featured_card_large
    - field.field.node.CONTENT_TYPE_NAME.DESCRIPTION_FIELD_NAME
    - field.field.node.CONTENT_TYPE_NAME.MEDIA_FIELD_NAME
    - node.type.CONTENT_TYPE_NAME
  module:
    - display_builder
    - image
    - text
third_party_settings:
  display_builder:
    profile: default
    sources:
      - source_id: entity_field
        source:
          derivable_context: 'field:node:CONTENT_TYPE_NAME:MEDIA_FIELD_NAME'
          'field:node:CONTENT_TYPE_NAME:MEDIA_FIELD_NAME':
            value:
              sources:
                - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:MEDIA_FIELD_NAME'
                  source:
                    type: image
                    label: hidden
                    settings:
                      image_link: content
                      image_style: wide
                      image_loading:
                        attribute: lazy
                    third_party_settings: {  }
      - source_id: entity_field
        source:
          derivable_context: 'field:node:CONTENT_TYPE_NAME:title'
          'field:node:CONTENT_TYPE_NAME:title':
            value:
              sources:
                - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:title'
                  source:
                    type: string
                    label: hidden
                    settings:
                      link_to_entity: true
                    third_party_settings: {  }
      - source_id: entity_field
        source:
          derivable_context: 'field:node:CONTENT_TYPE_NAME:created'
          'field:node:CONTENT_TYPE_NAME:created':
            value:
              sources:
                - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:created'
                  source:
                    type: timestamp
                    label: hidden
                    settings:
                      date_format: medium
                      custom_date_format: ''
                      timezone: ''
                    third_party_settings: {  }
      - source_id: entity_field
        source:
          derivable_context: 'field:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME'
          'field:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME':
            value:
              sources:
                - source_id: 'field_formatter:node:CONTENT_TYPE_NAME:DESCRIPTION_FIELD_NAME'
                  source:
                    type: text_summary_or_trimmed
                    label: hidden
                    settings:
                      trim_length: 200
                    third_party_settings: {  }
id: node.CONTENT_TYPE_NAME.featured_card_large
targetEntityType: node
bundle: CONTENT_TYPE_NAME
mode: featured_card_large
content: {  }
hidden: {  }
